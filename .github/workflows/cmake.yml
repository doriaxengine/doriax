name: Editor Desktop

on:
  push:
    branches:
      # '**' and not '*': a single star stops at '/', so fix/x never builds.
      - '**'
  release:
    types: [published]

permissions:
  contents: read
  actions: read

# One run per branch: a push while the matrix is still going supersedes it.
# Releases are never cancelled, so a re-run cannot race the asset upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  BUILD_TYPE: Release
  TARGET: doriax-editor
  SIGNPATH_ORGANIZATION_ID: 71ade14e-ea98-448b-b32f-954d41e71ef9
  SIGNPATH_PROJECT_SLUG: doriax

jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    # Must resolve to null and not "" on the other entries: an empty container
    # is still a container job, which Windows and macOS runners reject.
    container: ${{ matrix.config.container || fromJSON('null') }}
    defaults:
      run:
        shell: ${{ matrix.config.shell || 'bash' }}
    env:
      # Do not sign yet
      #SIGN_WINDOWS: ${{ matrix.config.cc == 'cl' && secrets.SIGNPATH_API_TOKEN != '' && (github.event_name == 'release' || github.ref == 'refs/heads/test-signing') }}
      SIGN_WINDOWS: false
    strategy:
      fail-fast: false
      matrix:
        config: 
        - {
            name: "Windows Latest MSVC",
            os: windows-latest,
            artifact: "doriax_windows",
            cc: "cl",
            cxx: "cl",
            generators: "Visual Studio 18 2026"
          }
        - {
            name: "Windows Latest MinGW (UCRT64)",
            os: windows-latest,
            artifact: "doriax_windows_mingw",
            cc: "gcc",
            cxx: "g++",
            generators: "Ninja",
            shell: "msys2 {0}"
          }
        # The container pins the glibc floor to 22.04 instead of the runner
        # image's. Moving it also moves the distros AppRun's refusal names.
        - {
            name: "Ubuntu Latest GCC",
            os: ubuntu-latest,
            container: "ubuntu:22.04",
            artifact: "doriax_linux",
            cc: "gcc",
            cxx: "g++",
            generators: "Ninja"
          }
        - {
            name: "macOS Latest Clang",
            os: macos-latest,
            artifact: "doriax_macos",
            cc: "clang",
            cxx: "clang++",
            generators: "Ninja"
          }

    steps:
      - name: Prepare container
        if: matrix.config.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          # The workspace is bind-mounted from the host runner's user, so git
          # refuses to work in it as root until the path is marked safe.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v6
        with:
          submodules: true
          # Full history so git describe can resolve v0.6-N-gHASH like local builds.
          fetch-depth: 0

      - name: Print env
        shell: bash
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}

      - name: Set up MSYS2 UCRT64
        if: matrix.config.artifact == 'doriax_windows_mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # The toolchain README.md documents for a source build
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install dependencies on Windows
        if: matrix.config.cc == 'cl'
        run: |
          choco install ninja cmake
          ninja --version
          cmake --version

      - name: Install Vulkan SDK on Windows
        if: startsWith(matrix.config.os, 'windows')
        uses: jakoch/install-vulkan-sdk-action@v1.0.0
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          apt-get update
          # file is not a build dependency: appimagetool shells out to it.
          apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config python3 wget gpg file \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev \
            libwayland-dev wayland-protocols extra-cmake-modules \
            libdbus-1-dev libcurl4-openssl-dev
          # 22.04 ships CMake 3.22; the vendored glslang requires 3.27 or newer.
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y --no-install-recommends cmake
          ninja --version
          cmake --version
          gcc --version

      - name: Install dependencies on macOS
        if: startsWith(matrix.config.os, 'macos')
        run: |
          # cmake is already installed
          brew install ninja
          ninja --version
          cmake --version

      - name: Set version
        shell: bash
        run: |
          # Same command as CMakeLists.txt. fetch-depth: 0 + tags so describe
          # can resolve v0.6-N-gHASH the same way as a local clone.
          git fetch --tags --quiet || true
          VERSION="$(git describe --tags --always --dirty)"
          echo "DORIAX_VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Configure
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: |
          mkdir build
          mkdir instdir
          cmake \
            -S . \
            -B build \
            -DDORIAXEDITOR_VERSION:STRING="$DORIAX_VERSION" \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -G "${{ matrix.config.generators }}" \
            -DCMAKE_INSTALL_PREFIX:PATH=instdir \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: |
          targets=("${{ env.TARGET }}")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            targets+=("${{ env.TARGET }}-cmd")
          fi
          cmake --build build --config ${{env.BUILD_TYPE}} --target "${targets[@]}"

      - name: Install Strip
        run: cmake --install build --config ${{env.BUILD_TYPE}} --strip
        
      - name: List directories
        shell: bash
        working-directory: instdir
        run: ls -laR

      - name: Check the GCC runtime was packaged
        if: matrix.config.artifact == 'doriax_windows_mingw'
        shell: bash
        run: |
          for dll in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            test -f "instdir/bin/$dll" || { echo "missing instdir/bin/$dll"; exit 1; }
          done

      - name: Collect Windows binaries for signing
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          mkdir to-sign
          find instdir/bin -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dll' \) -exec cp {} to-sign/ \;
          ls -la to-sign

      - name: Upload unsigned binaries
        id: upload-unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}_unsigned
          path: ./to-sign/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign binaries with SignPath
        if: env.SIGN_WINDOWS == 'true'
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ github.event_name == 'release' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          wait-for-completion-timeout-in-seconds: 1800

      - name: Put signed binaries back
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          cp signed/* instdir/bin/
          ls -la instdir/bin

      - name: Package the Linux build
        if: startsWith(matrix.config.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # The AppDir is the same install tree under usr/: $ORIGIN and engine-sdk/
          # already resolve relative to the binary, so nothing moves.
          rm -rf AppDir && mkdir AppDir
          cp -a instdir AppDir/usr
          cp editor/resources/linux/doriax-editor.desktop AppDir/
          cp editor/resources/icons/linux/doriax-editor-512.png AppDir/doriax-editor.png

          # 22.04's libstdc++ is newer than older targets carry, and DORIAX_SHARED
          # rules out -static-libstdc++: the editor and libdoriax.so would each get
          # their own runtime.
          mkdir -p AppDir/usr/lib
          for lib in libstdc++.so.6 libgcc_s.so.1; do
            cp -L "$(gcc -print-file-name="$lib")" "AppDir/usr/lib/$lib"
          done

          # glibc cannot ride along the way libstdc++ can, so AppRun turns anything
          # older than these binaries were linked against away with a message.
          GLIBC_FLOOR="$(objdump -T AppDir/usr/bin/doriax-editor AppDir/usr/bin/libdoriax.so \
            AppDir/usr/lib/libstdc++.so.6 AppDir/usr/lib/libgcc_s.so.1 \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          echo "glibc floor: $GLIBC_FLOOR"

          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"

          # Highest GLIBCXX_3.4.N a libstdc++ carries. strings(1) is not a given on a
          # desktop, grep is.
          glibcxx_minor() {
            [ -r "$1" ] || return 1
            grep -ao 'GLIBCXX_3\.4\.[0-9][0-9]*' "$1" | sed 's/.*\.//' | sort -n | tail -1
          }

          # Only take over where the host's runtime is older: doing it everywhere would
          # hand the host's Mesa an older libstdc++ than it was built against. Ask the
          # loader where that copy is rather than guess at distro layouts.
          host_lib="$(LD_TRACE_LOADED_OBJECTS=1 "$HERE/usr/bin/doriax-editor" 2>/dev/null \
            | sed -n 's/.*libstdc++\.so\.6 => \([^ ]*\).*/\1/p')"
          bundled="$(glibcxx_minor "$HERE/usr/lib/libstdc++.so.6")"
          host="$(glibcxx_minor "$host_lib")"
          if [ -n "$bundled" ] && { [ -z "$host" ] || [ "$host" -lt "$bundled" ]; }; then
            LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export LD_LIBRARY_PATH
          fi

          glibc="$(getconf GNU_LIBC_VERSION 2>/dev/null | awk '{print $NF}')"
          if [ -n "$glibc" ] && [ "$glibc" != "@GLIBC_FLOOR@" ] \
            && [ "$(printf '%s\n%s\n' "$glibc" "@GLIBC_FLOOR@" | sort -V | head -1)" = "$glibc" ]; then
            msg="Doriax needs glibc @GLIBC_FLOOR@ or newer, and this system has $glibc.
          Ubuntu 22.04 and Debian 12 are the oldest releases it runs on; older ones
          need a build from source."
            printf '%s\n' "$msg" >&2
            # Started from a launcher the message has nowhere to go, so it needs a
            # window. Closing a zenity dialog exits non-zero, so pick on what exists.
            if [ ! -t 2 ]; then
              if command -v zenity >/dev/null 2>&1; then zenity --error --no-wrap --text="$msg" 2>/dev/null
              elif command -v xmessage >/dev/null 2>&1; then xmessage -center "$msg" 2>/dev/null
              fi
            fi
            exit 1
          fi

          exec "$HERE/usr/bin/doriax-editor" "$@"
          APPRUN
          sed -i "s/@GLIBC_FLOOR@/$GLIBC_FLOOR/g" AppDir/AppRun
          chmod +x AppDir/AppRun

          # Pinned: "continuous" would put an unreviewed build of a tool that
          # repackages the editor into the release path.
          APPIMAGETOOL_VERSION=1.9.1
          APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          # ARCH is guessed from ELF files otherwise, and there is no FUSE here.
          # -u writes a .zsync so AppImageUpdate and Gear Lever can delta-update
          # from the release assets.
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir \
            -u "gh-releases-zsync|doriaxengine|doriax|latest|Doriax-*-x86_64.AppImage.zsync" \
            "dist/Doriax-${DORIAX_VERSION}-linux-x86_64.AppImage"

          # appimagetool writes the .zsync in the working directory, not beside the
          # AppImage, and -u embeds update info even if zsyncmake never ran.
          mv "Doriax-${DORIAX_VERSION}-linux-x86_64.AppImage.zsync" dist/
          test -s "dist/Doriax-${DORIAX_VERSION}-linux-x86_64.AppImage.zsync"

          ls -la dist

      - name: Package the macOS app
        if: startsWith(matrix.config.os, 'macos')
        shell: bash
        run: |
          set -uo pipefail

          APP="$(find instdir -maxdepth 4 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::no .app found under instdir"
            find instdir | head -40
            exit 1
          fi
          echo "Bundle: $APP"

          # --strip invalidates the linker's ad-hoc signature, fatal on Apple Silicon.
          codesign --remove-signature "$APP" 2>/dev/null || true
          for dylib in "$APP"/Contents/MacOS/*.dylib; do
            [ -e "$dylib" ] && codesign --force --sign - --timestamp=none "$dylib"
          done
          if ! codesign --force --sign - --timestamp=none "$APP"; then
            echo "::error::codesign rejected the bundle"
            find "$APP" -maxdepth 3 | head -40
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$APP" || echo "::warning::strict verify failed"

          set -e
          # The bundle's files as a loose tree: doriax-editor, libdoriax.dylib,
          # engine-sdk/. Actions wraps this as doriax_macos.zip.
          BIN="$APP/Contents/MacOS"
          mkdir -p dist/macos-zip
          cp "$BIN/$(basename "$APP" .app)" dist/macos-zip/doriax-editor
          for dylib in "$BIN"/*.dylib; do
            [ -e "$dylib" ] && cp "$dylib" dist/macos-zip/
          done
          if [ -d "$APP/Contents/Resources/engine-sdk" ]; then
            cp -R "$APP/Contents/Resources/engine-sdk" dist/macos-zip/engine-sdk
          else
            echo "::error::no engine-sdk/ in the bundle"
            find "$APP" | head -40
            exit 1
          fi
          chmod +x dist/macos-zip/doriax-editor
          for dylib in dist/macos-zip/*.dylib; do
            [ -e "$dylib" ] && codesign --force --sign - --timestamp=none "$dylib"
          done
          codesign --force --sign - --timestamp=none dist/macos-zip/doriax-editor

          # Artifact zips lose the executable bit, so ship a dmg too.
          mkdir dmg-stage
          cp -R "$APP" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Doriax" -srcfolder dmg-stage -ov -format UDZO dist/Doriax.dmg
          rm -rf dmg-stage
          ls -la dist dist/macos-zip instdir/bin

      - name: Upload
        if: ${{ !startsWith(matrix.config.os, 'macos') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: ./instdir/bin/*
          if-no-files-found: error

      - name: Upload macOS zip
        if: startsWith(matrix.config.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: ./dist/macos-zip/*
          if-no-files-found: error

      # Separate artifacts so a download is one package, not both of them.
      - name: Upload macOS dmg
        if: startsWith(matrix.config.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}_dmg
          path: ./dist/*.dmg
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: startsWith(matrix.config.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}_appimage
          path: ./dist/*.AppImage
          if-no-files-found: error

      # Only AppImageUpdate and Gear Lever read this, and only off a release, so
      # it travels separately instead of in the download.
      - name: Upload Linux zsync
        if: startsWith(matrix.config.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}_zsync
          path: ./dist/*.zsync
          if-no-files-found: error

  # Artifacts are only ever served as zips, so a published release is what gives
  # a direct download. MinGW is left off: MSVC is the build a release ships, and
  # while SIGN_WINDOWS is off neither of them is signed.
  release:
    name: Attach binaries to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir release

          # The artifacts came through an Actions zip, which dropped the
          # executable bit the release archives ship with.
          chmod +x artifacts/doriax_linux/doriax-editor
          chmod +x artifacts/doriax_macos/doriax-editor

          # A tree of binaries still needs an archive.
          (cd artifacts/doriax_windows && zip -qr "$GITHUB_WORKSPACE/release/Doriax-${VERSION}-windows-x64.zip" .)
          (cd artifacts/doriax_linux && zip -qr "$GITHUB_WORKSPACE/release/Doriax-${VERSION}-linux-x86_64.zip" .)
          (cd artifacts/doriax_macos && zip -qr "$GITHUB_WORKSPACE/release/Doriax-${VERSION}-macos-universal.zip" .)

          # The .zsync names the AppImage it belongs to, so the pair keeps the
          # filenames it was built with.
          cp artifacts/doriax_linux_appimage/* release/
          cp artifacts/doriax_linux_zsync/* release/
          cp artifacts/doriax_macos_dmg/Doriax.dmg "release/Doriax-${VERSION}-macos-universal.dmg"
          ls -la release
          # --clobber so re-running the workflow on a release replaces the assets.
          gh release upload "$VERSION" release/* --clobber --repo "$GITHUB_REPOSITORY"
